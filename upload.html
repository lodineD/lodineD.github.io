<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图床上传</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #e0e0e0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { width: 100%; max-width: 520px; padding: 32px; }
    h1 { font-size: 20px; margin-bottom: 24px; color: #fff; }
    .key-row { margin-bottom: 16px; }
    .key-row label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; }
    .key-row input { width: 100%; padding: 8px 12px; background: #111; border: 1px solid #333; border-radius: 6px; color: #e0e0e0; font-size: 13px; font-family: monospace; }
    .key-row input:focus { outline: none; border-color: #4f8cff; }
    .dropzone { border: 2px dashed #333; border-radius: 12px; padding: 48px 24px; text-align: center; cursor: pointer; transition: border-color .2s, background .2s; margin-bottom: 20px; }
    .dropzone:hover, .dropzone.dragover { border-color: #4f8cff; background: #1a1a2e; }
    .dropzone p { color: #666; margin-bottom: 8px; }
    .dropzone .hint { font-size: 12px; color: #444; }
    input[type=file] { display: none; }
    .result { background: #111; border: 1px solid #222; border-radius: 8px; padding: 16px; margin-top: 16px; word-break: break-all; }
    .label { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 4px; }
    .url-box { background: #0a0a0a; border: 1px solid #222; border-radius: 6px; padding: 8px 12px; font-size: 13px; font-family: monospace; color: #a0d0ff; margin-bottom: 10px; cursor: pointer; }
    .url-box:hover { border-color: #4f8cff; }
    .preview { margin-top: 12px; border-radius: 8px; overflow: hidden; border: 1px solid #222; }
    .preview img { width: 100%; display: block; }
    .status { padding: 8px 0; font-size: 13px; color: #888; }
    .status.error { color: #ff6b6b; }
    .status.ok { color: #6bffa0; }
    .copy-hint { font-size: 11px; color: #333; text-align: right; margin-top: -8px; margin-bottom: 8px; }
    .btn { display: inline-block; background: #4f8cff; color: #fff; border: none; border-radius: 6px; padding: 8px 20px; font-size: 14px; cursor: pointer; }
    .btn:hover { background: #3d72e0; }
    .btn:disabled { background: #333; cursor: not-allowed; }
  </style>
</head>
<body>
<div class="container">
  <h1>📷 图床上传 · logicblog.cc</h1>

  <div class="key-row">
    <label>API Key</label>
    <input type="password" id="apiKey" placeholder="输入 IMAGE_API_KEY" value="">
  </div>

  <div class="dropzone" id="dz">
    <p>拖拽图片到这里，或点击选择</p>
    <p class="hint">支持 PNG / JPG / GIF / WebP / SVG，最大 50MB</p>
    <input type="file" id="file" accept="image/*" multiple>
  </div>

  <button class="btn" id="uploadBtn" disabled>上传</button>
  <div class="status" id="status"></div>

  <div id="results"></div>
</div>

<script>
const dz = document.getElementById('dz');
const fileInput = document.getElementById('file');
const uploadBtn = document.getElementById('uploadBtn');
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');
const apiKeyInput = document.getElementById('apiKey');
let selectedFiles = [];

apiKeyInput.value = localStorage.getItem('img_api_key') || '';
apiKeyInput.addEventListener('change', () => localStorage.setItem('img_api_key', apiKeyInput.value));

dz.addEventListener('click', () => fileInput.click());
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
dz.addEventListener('drop', e => {
  e.preventDefault();
  dz.classList.remove('dragover');
  selectedFiles = [...e.dataTransfer.files].filter(f => f.type.startsWith('image/'));
  fileInput.files = e.dataTransfer.files;
  updateUI();
});
fileInput.addEventListener('change', () => {
  selectedFiles = [...fileInput.files];
  updateUI();
});

function updateUI() {
  if (selectedFiles.length > 0) {
    dz.querySelector('p').textContent = `已选择 ${selectedFiles.length} 个文件`;
    uploadBtn.disabled = false;
  }
}

uploadBtn.addEventListener('click', async () => {
  const apiKey = apiKeyInput.value.trim();
  if (!apiKey) { statusEl.className = 'status error'; statusEl.textContent = '请先输入 API Key'; return; }
  if (selectedFiles.length === 0) return;

  uploadBtn.disabled = true;
  statusEl.className = 'status';
  statusEl.textContent = '上传中...';
  resultsEl.innerHTML = '';

  let ok = 0, fail = 0;
  for (const file of selectedFiles) {
    try {
      // 读取文件为 ArrayBuffer，直接发送二进制体
      const arrayBuffer = await file.arrayBuffer();
      const resp = await fetch('/api/upload', {
        method: 'POST',
        headers: {
          'Content-Type': file.type,
          'X-API-Key': apiKey,
          'X-Filename': encodeURIComponent(file.name),
        },
        body: arrayBuffer,
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);
      ok++;
      appendResult(data, file);
    } catch (err) {
      fail++;
      statusEl.className = 'status error';
      statusEl.textContent = `失败: ${err.message}`;
    }
  }

  statusEl.className = 'status ok';
  statusEl.textContent = `完成：${ok} 成功，${fail} 失败`;
  uploadBtn.disabled = false;
});

function appendResult(data, file) {
  const div = document.createElement('div');
  div.className = 'result';
  const url = data.url;
  div.innerHTML = `
    <div class="label">图片地址（点击复制）</div>
    <div class="url-box" onclick="copyText(this.textContent)">${url}</div>
    <div class="copy-hint">Markdown: ![image](${url})</div>
    <div class="preview"><img src="${url}" alt="${file.name}" onerror="this.parentElement.style.display='none'"></div>
  `;
  resultsEl.prepend(div);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    statusEl.className = 'status ok';
    statusEl.textContent = '已复制！';
    setTimeout(() => { statusEl.textContent = ''; }, 1500);
  } catch {
    statusEl.className = 'status error';
    statusEl.textContent = '复制失败，请手动复制';
  }
}
</script>

    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
